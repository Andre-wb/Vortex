[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "vortex-chat-rs"
version = "0.3.0"
description = "Vortex crypto, BMP and transport helpers — Rust engine with Python bindings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Boris Maltsev" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security :: Cryptography",
]

[tool.maturin]
module-name = "vortex_chat"
features = ["extension-module"]
strip = true
