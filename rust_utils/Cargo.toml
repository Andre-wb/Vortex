[package]
name = "vortex_chat"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vortex_chat"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3.workspace = true
pyo3-log.workspace = true
log.workspace = true
blake3.workspace = true
blake2 = "0.10"
aes-gcm.workspace = true
x25519-dalek.workspace = true
vortex-transport = { path = "../vortex-transport" }
ed25519-dalek.workspace = true
rand_core = "0.6"
rand.workspace = true
hkdf.workspace = true
ml-kem.workspace = true
tokio = { version = "1", features = ["full"] }
serde.workspace = true
serde_json.workspace = true
argon2 = "0.5"
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
hex.workspace = true
once_cell = "1.19"
dashmap.workspace = true
parking_lot.workspace = true
vortex-auth = { path = "../vortex-auth" }
vortex-core = { path = "../vortex-core" }
vortex-delivery = { path = "../vortex-delivery" }
vortex-resume = { path = "../vortex-resume" }
vortex-live = { path = "../vortex-live" }
vortex-bmp = { path = "../vortex-bmp" }
vortex-redis = { path = "../vortex-redis" }
vortex-net = { path = "../vortex-net" }
vortex-proto = { path = "../vortex-proto" }
vortex-ratelimit = { path = "../vortex-ratelimit" }
vortex-storage = { path = "../vortex-storage" }
rayon = "1.10"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
pyo3 = { version = "0.23", features = ["auto-initialize"] }

[features]
extension-module = ["pyo3/extension-module"]