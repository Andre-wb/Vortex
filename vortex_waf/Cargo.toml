[package]
name = "vortex_waf"
version = "0.1.0"
edition.workspace = true
description = "Web Application Firewall для Vortex — гексагональная архитектура на трейтах"
license = "AGPL-3.0-or-later"
repository.workspace = true

[lib]
name = "vortex_waf"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
pyo3 = { workspace = true, optional = true }

[features]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
