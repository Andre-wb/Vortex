[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex-chat"
version = "1.0.0"
description = "100% decentralized P2P messenger with E2E encryption"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [{name = "Vortex Team"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "SQLAlchemy>=2.0.20",
    "jinja2>=3.1.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-magic>=0.4.27",
    "defusedxml>=0.7.1",
    "Pillow>=10.0.0",
    "argon2-cffi>=23.1.0",
    "blake3>=0.4.0",
    "curl_cffi>=0.7.0",
    "pywebpush>=2.0.0",
    "pyotp>=2.9.0",
    "alembic>=1.13.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=1.40.0",
    "redis[hiredis]>=5.0.0",
    "bleak>=0.21.0",
    "dbus-next>=0.2.3",
]

[project.optional-dependencies]
transport-windows = [
    "winrt-Windows.Devices.WiFiDirect>=2.1.0",
    "winrt-Windows.Devices.Enumeration>=2.1.0",
]
post-quantum = [
    "liboqs-python>=0.10.0",
    "pqcrypto>=0.1.3",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-httpx>=0.30.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.3.0",
    "pylint==4.0.6",
    "bandit>=1.7.0",
    "pre-commit>=3.6.0",
    "mypy>=1.8.0",
]
prod = [
    "gunicorn>=21.2.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
]

[project.scripts]
vortex = "run:main"


[tool.ruff]
target-version = "py310"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "S",     # bandit (security)
    "T20",   # print statements
    "SIM",   # simplify
    "TC",    # type-checking imports
    "RUF",   # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert (needed in tests)
    "S104",   # bind to 0.0.0.0
    "S603",   # subprocess call
    "S607",   # partial path subprocess
    "B008",   # function call in default arg (FastAPI Depends)
    "T201",   # print (used in CLI run.py)
    "RUF012", # mutable class default
    "N805",   # first argument naming
    "UP007",  # Optional → X | None (keep for readability)
    "UP045",  # Optional[X] → X | None (same decision as UP007)
    "TC001",  # runtime-evaluated annotations (FastAPI Depends, Pydantic)
    "TC002",
    "TC003",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101", "S106", "S311"]
"conftest.py" = ["S101", "S106", "S311"]
"run.py" = ["T201", "T203"]
"app/benchmarks/*" = ["T201", "S311"]
"app/main.py" = ["E402"]
"app/tests/test_ide.py" = ["E402"]
"app/chats/messages/core.py" = ["E402", "I001", "F401", "F811", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["app"]


[tool.pylint.main]
py-version = "3.10"
jobs = 0
persistent = false
recursive = true
fail-under = 9.54
ignore = [".git", "__pycache__", ".venv", ".venv-build", "node_modules", "build", "dist", "target"]
extension-pkg-allow-list = ["blake3", "curl_cffi", "pydantic_core"]

[tool.pylint.messages_control]
disable = [
    "C0114",
    "C0115",
    "C0116",
    "C0415",
    "W0404",
    "W0611",
    "C0410",
    "C0411",
    "C0412",
    "C0413",
    "C0321",
    "C0121",
    "R0801",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.typecheck]
ignored-modules = [
    "vortex_chat",
    "vortex_waf",
    "sqlalchemy.sql.functions",
    "winrt",
    "winrt.windows.devices.enumeration",
    "winrt.windows.devices.wifidirect",
    "pqcrypto",
    "pqcrypto.kem.kyber768",
    "oqs",
    "torch",
    "transformers",
    "passlib",
    "passlib.hash",
    "netifaces",
    "bless",
    "dbus_next",
    "aiortc",
    "solders",
    "boto3",
    "google.cloud",
    "google.oauth2",
    "AppKit",
    "objc",
    "Foundation",
]

[tool.pylint.reports]
score = true

[tool.pylint.basic]
good-names = ["i", "j", "k", "n", "e", "f", "r", "s", "t", "v", "db", "ws", "id", "ip", "pk", "sk", "ct", "ss", "iv", "ok", "_"]


[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["tests.py", "test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--no-header",
    "-ra",
    "--color=yes",
    "--durations=10",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=88",
    "--timeout=30",
]
markers = [
    "slow: tests that take > 1 sec",
    "crypto: crypto core tests (AES, ECIES, SHA-256)",
    "auth: authentication tests",
    "rooms: room tests",
    "files: file upload tests",
    "websocket: WebSocket tests",
    "security: security tests (WAF, SQLi, XSS, CSRF)",
    "metrics: performance benchmarks",
    "integration: end-to-end integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]


[tool.coverage.run]
source = ["app"]
omit = [
    "app/tests/*",
    "app/benchmarks/*",
    "app/__init__.py",
    "app/transport/*",
    "app/routes/*",
    "app/services/*",
    "app/chats/chat.py",
    "app/chats/voice.py",
    "app/files/resumable.py",
    "app/bots/bot_api.py",
    "app/peer/peer_registry.py",
    "app/federation/federation.py",
    "app/main.py",
    "app/config.py",
    "app/database.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "import vortex_chat",
    "_vc\\.",
    "if _RUST:",
    "_RUST",
    "except WebSocketDisconnect",
    "async def websocket",
    "logger\\.(info|warning|error|debug|exception)",
    "except (ImportError|ModuleNotFoundError)",
    "except Exception",
    "db\\.rollback",
    "if _IS_TESTING",
    "if not request\\.client",
]
show_missing = true


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true


[tool.bandit]
exclude_dirs = ["app/tests", "app/benchmarks"]
skips = ["B101", "B104"]
