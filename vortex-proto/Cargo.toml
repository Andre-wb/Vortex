[package]
name = "vortex-proto"
version = "0.1.0"
edition.workspace = true
description = "Типы протокола Vortex: pre-key бандлы и идентичность устройства"
license.workspace = true
repository.workspace = true

[lib]
name = "vortex_proto"
path = "src/lib.rs"

[dependencies]
vortex-core = { path = "../vortex-core" }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "prekeys"
harness = false

[[bench]]
name = "wire"
harness = false
