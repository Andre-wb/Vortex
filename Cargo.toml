[workspace]
resolver = "2"
members = ["rust_utils", "vortex_waf", "vortex-transport"]
exclude = ["src-tauri", "Gravitix", "solana_program"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/BorisMalts/Vortex"

[workspace.dependencies]
pyo3 = { version = "0.23", features = ["generate-import-lib"] }
log = "0.4"
pyo3-log = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
blake3 = "1.5"
regex = "1"
ml-kem = { version = "0.2", features = ["deterministic"] }
aes-gcm = "0.10"
hkdf = "0.12"
subtle = "2.6.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
