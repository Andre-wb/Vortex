[workspace]
resolver = "2"
members = [
    "rust_utils",
    "vortex_waf",
    "vortex-transport",
    "vortex-bmp",
    "vortex-redis",
    "vortex-net",
    "vortex-proto",
    "vortex-core",
    "vortex-storage",
    "vortex-auth",
    "vortex-ratelimit",
    "vortex-live",
    "vortex-delivery",
    "vortex-resume",
    "vortex-routing",
    "vortex-server",
]
exclude = ["src-tauri", "Gravitix", "solana_program"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/BorisMalts/Vortex"

[workspace.dependencies]
pyo3 = { version = "0.23", features = ["generate-import-lib"] }
log = "0.4"
pyo3-log = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
blake3 = "1.5"
regex = "1"
ml-kem = { version = "0.2", features = ["deterministic"] }
aes-gcm = "0.10"
hkdf = "0.12"
subtle = "2.6.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["batch", "rand_core"] }
base64 = "0.22"
dashmap = "5"
parking_lot = "0.12"
criterion = "0.5"
tokio = { version = "1", features = ["full"] }
fred = { version = "10", default-features = false, features = [
    "i-std",
    "i-keys",
    "i-hashes",
    "i-sets",
    "i-sorted-sets",
    "i-scripts",
    "i-server",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "time",
] }
time = "0.3"
async-trait = "0.1"
axum = "0.8"
hyper = "1"
hyper-util = "0.1"
http = "1"
http-body-util = "0.1"
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "http2",
] }
prometheus = { version = "0.14", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
